server:
  port: 8080 # 后端服务端口

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/logiflow_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: "" # 本机 root 无密码

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# MyBatis-Plus 专属全局配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名自动转换 (user_id -> userId)
  global-config:
    db-config:
      logic-delete-field: deleted # 全局逻辑删除字段名
      logic-delete-value: 1       # 逻辑已删除值
      logic-not-delete-value: 0   # 逻辑未删除值

# JWT 密钥
jwt:
  secret: ${JWT_SECRET:logiflow-local-dev-secret-change-me-0123456789} # 生产环境请通过环境变量 JWT_SECRET 注入
  expiration: 604800000 # Token 过期时间，单位毫秒（这里是 7 天）

# 日志配置
logging:
  level:
    com.rickrone.logiflow: debug # 项目代码输出 DEBUG，框架日志保持 INFO
  file:
    name: logs/logiflow.log # 控制台 + 文件双输出
  logback:
    rollingpolicy:
      max-file-size: 10MB # 单文件上限，超过自动切分
      max-history: 7 # 保留天数
      total-size-cap: 500MB # 日志目录总大小上限